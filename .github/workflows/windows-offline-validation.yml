# ============================================================================
# CLASH - Windows offline validation (Rounds 11-20)
#
# WHY THIS FILE EXISTS
# --------------------
# Every round before this one was validated on Linux, where Windows PowerShell
# 5.1 does not exist. `tests/verify-package.mjs` proves the package statically
# (494 assertions, a real lexer, a structural lint) and that is worth having, but
# it cannot execute the one runtime the package ships for. Round 10 shipped a
# defect of exactly that shape: in `tools/test-native-capture.ps1` a membership
# test was written as
#
#     ((@('06-complete.json') | Where-Object { $names -contains $_ }).Count -gt 0)
#
# When no receipt matches, the pipeline emits nothing, `.Count` binds to
# [AutomationNull] and Set-StrictMode -Version 2.0 raises PropertyNotFoundStrict.
# Case 28 is the first case whose receipts carry no COMPLETE, so the harness
# aborted there on Windows PowerShell 5.1 and the adapter could never be
# certified. The offline suite could not see it: it asserts the text of that
# file, never its behaviour on the target runtime.
#
# This workflow is the missing gate. It executes what the package actually does
# on windows-2022 with powershell.exe (5.1, Desktop edition). `pwsh` is never
# used, and the runtime assertion refuses to run anywhere else.
#
# OFFLINE AND CREDENTIAL-FREE BY CONSTRUCTION
# -------------------------------------------
#   * no deployment script is invoked. `deploy.ps1` and `check-ledger.ps1` are
#     never referenced by any step in this file; only the self-test, the offline
#     manifest proof and the offline test launcher run.
#   * no database, no Supabase project, no network call after the checkout.
#   * no secret is read, set or required; every receipt writer sanitises before
#     encoding. The image's own PGUSER/PGPASSWORD (a throwaway local PostgreSQL
#     role) and every Supabase variable are cleared at job level, and a guard
#     step fails the job if any of them is non-empty again.
#   * the only token the job may use is `contents: read`, and the checkout does
#     not persist it. No environment, no deployment target, no write scope.
#
# FAIL-CLOSED
# -----------
# Each gate is its own step, so a non-zero exit stops every later gate. Nothing
# here treats silence as success: the adapter gate asserts 150/150 executed cases
# through the package's own validator, and the suite gate asserts 494 passed /
# 0 failed / machine summary agreement, not merely "no output and exit 0".
#
# DIAGNOSTICS
# -----------
# Step logs live behind a storage host that some networks cannot reach, so this
# workflow also publishes its state as check annotations (`::notice::`,
# `::error::`) - runtime edition, credential scan, and the verdict, case counts
# and problem list read back out of the receipts the gates wrote. A failing run
# therefore explains itself on the commit page, and the same receipts are
# uploaded as artefacts.
# ============================================================================
name: Windows offline validation (PowerShell 5.1)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-offline-validation:
    name: windows-2022 / powershell.exe 5.1 / offline
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read

    # The windows-2022 image ships a local PostgreSQL installation and exports
    # PGUSER/PGPASSWORD (and friends) into every step. That is a throwaway local
    # role, not a project secret, but this job must not be able to reach ANY
    # database - so every PostgreSQL/Supabase variable is cleared here, at job
    # level, for every step's process. The guard step below then fails the job if
    # one of them is ever non-empty again, which is what makes "credential-free"
    # an enforced property rather than a promise.
    env:
      PGPASSWORD: ''
      PGPASSFILE: ''
      PGHOST: ''
      PGHOSTADDR: ''
      PGUSER: ''
      PGDATABASE: ''
      PGPORT: ''
      PGSSLMODE: ''
      PGSSLROOTCERT: ''
      PGSERVICE: ''
      PGOPTIONS: ''
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      SUPABASE_URL: ''
      SUPABASE_ANON_KEY: ''

    steps:
      - name: Check out this commit without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Diagnostics - runtime and credential scan, published as annotations
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -Command "try { $v = $PSVersionTable;
          Write-Host ('::notice::CLASH-RUNTIME ' + $v.PSVersion + ' edition=' + $v.PSEdition);
          foreach ($n in @('PGPASSWORD', 'PGPASSFILE', 'PGHOST', 'PGHOSTADDR', 'PGUSER', 'PGDATABASE',
          'PGPORT', 'PGSSLMODE', 'PGSSLROOTCERT', 'PGSERVICE', 'PGOPTIONS', 'DATABASE_URL',
          'SUPABASE_ACCESS_TOKEN', 'SUPABASE_DB_PASSWORD', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_URL', 'SUPABASE_ANON_KEY')) {
          $val = [Environment]::GetEnvironmentVariable($n); $len = 0; if ($null -ne $val) { $len = $val.Length };
          Write-Host ('::notice::CLASH-ENVCHECK ' + $n + ' length=' + $len) } }
          catch { Write-Host ('::error::CLASH-DIAGNOSTICS-FAILED ' + ($_.Exception.Message -replace '\r?\n', ' ')); exit 1 }"

      - name: Guard - no credential may be present in this job
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -Command "try { $ErrorActionPreference = 'Stop'; $names = @('PGPASSWORD',
          'PGPASSFILE', 'PGHOST', 'PGHOSTADDR', 'PGUSER', 'PGDATABASE', 'PGPORT', 'PGSSLMODE',
          'PGSSLROOTCERT', 'PGSERVICE', 'PGOPTIONS', 'DATABASE_URL', 'SUPABASE_ACCESS_TOKEN',
          'SUPABASE_DB_PASSWORD', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_URL', 'SUPABASE_ANON_KEY'); $found = @();
          foreach ($n in $names) { $v = [Environment]::GetEnvironmentVariable($n); if (-not [string]::IsNullOrWhiteSpace($v)) { $found += $n } };
          if ($found.Count -gt 0) { throw ('REFUSED: this job must run without credentials, but these are set: ' + ($found -join ', ')) };
          Write-Host ('::notice::CLASH-CREDENTIAL-FREE-OK checked=' + $names.Count) }
          catch { Write-Host ('::error::CLASH-CREDENTIAL-GUARD ' + ($_.Exception.Message -replace '\r?\n', ' ')); exit 1 }"

      - name: Assert the runtime is Windows PowerShell 5.1 (never pwsh)
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -Command "try { $ErrorActionPreference = 'Stop'; $v = $PSVersionTable;
          if ($v.PSVersion.Major -ne 5 -or $v.PSVersion.Minor -ne 1 -or $v.PSEdition -ne 'Desktop') {
          throw ('REFUSED: this workflow certifies Windows PowerShell 5.1; running ' + $v.PSVersion + ' ' + $v.PSEdition) };
          Write-Host ('RUNTIME OK ' + $v.PSVersion + ' ' + $v.PSEdition) }
          catch { Write-Host ('::error::CLASH-RUNTIME-GATE ' + ($_.Exception.Message -replace '\r?\n', ' ')); exit 1 }"

      - name: Record the Node runtime (the suite is a native child, run through the adapter)
        shell: cmd
        run: node --version

      - name: Parse every package script with the 5.1 parser (negative control included)
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -Command "try { $ErrorActionPreference = 'Stop';
          $files = @(Get-ChildItem -Path 'supabase/cloud/tools' -Recurse -Filter '*.ps1' -File);
          if ($files.Count -ne 6) { throw ('expected 6 PowerShell files (5 tools + the adapter library), found ' + $files.Count) };
          $bad = @(); foreach ($f in $files) { $tokens = $null; $errors = $null;
          [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors);
          if ($errors.Count -gt 0) { $bad += ($f.Name + ': ' + (($errors | ForEach-Object { $_.Message }) -join '; ')) } };
          if ($bad.Count -gt 0) { throw ('parse errors: ' + ($bad -join ' | ')) };
          $probeTokens = $null; $probeErrors = $null;
          [void][System.Management.Automation.Language.Parser]::ParseInput('function Broken { if (', [ref]$probeTokens, [ref]$probeErrors);
          if ($probeErrors.Count -eq 0) { throw 'the parse gate cannot detect broken syntax, so a clean result means nothing' };
          Write-Host ('PARSE OK ' + $files.Count + ' files; negative control reported ' + $probeErrors.Count + ' error(s)') }
          catch { Write-Host ('::error::CLASH-PARSE-GATE ' + ($_.Exception.Message -replace '\r?\n', ' ')); exit 1 }"

      - name: Native adapter self-test - 150 cases on this runtime
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -File supabase/cloud/tools/test-native-capture.ps1
          -OutFile supabase/cloud/evidence-adapter/ci-adapter-selftest.json

      - name: Verify the adapter receipt with the package's own gate (PASS, 150/150, adapter 5.2.0)
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -Command "try { $ErrorActionPreference = 'Stop';
          $lib = 'supabase/cloud/tools/lib/clash-native.ps1';
          $receipt = 'supabase/cloud/evidence-adapter/ci-adapter-selftest.json'; . $lib;
          $identity = Get-ClashAdapterIdentity;
          if ([string]$identity.version -ne '5.2.0') { throw ('REFUSED: adapter version is ' + $identity.version + ', expected 5.2.0') };
          if ([string]$identity.id -ne 'clash-native-adapter') { throw ('REFUSED: adapter id is ' + $identity.id) };
          $r = Assert-AdapterSelfTest -ReceiptPath $receipt -AdapterPath $lib;
          if ([int]$r.casesExecuted -ne 150) { throw ('REFUSED: the receipt records ' + $r.casesExecuted + ' executed case(s), 150 are required') };
          if ([string]$r.powerShell -notmatch '^5\.1\.') { throw ('REFUSED: the receipt was produced on ' + $r.powerShell) };
          Write-Host ('ADAPTER RECEIPT OK cases=' + $r.casesExecuted + '/150 powerShell=' + $r.powerShell + ' receiptSha256=' + $r.receiptSha256) }
          catch { Write-Host ('::error::CLASH-ADAPTER-RECEIPT ' + ($_.Exception.Message -replace '\r?\n', ' ')); exit 1 }"

      - name: Offline manifest verification (111 originals, wrappers, checksums, git clean)
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -File supabase/cloud/tools/check-manifest.ps1

      - name: Offline Node package suite through the adapter (494 assertions)
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -File supabase/cloud/tools/run-tests.ps1

      - name: Verify the manifest receipt (status PASS, 111 entries)
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -Command "try { $ErrorActionPreference = 'Stop';
          $receipts = @(Get-ChildItem -Path 'supabase/cloud/evidence' -Filter '*-manifest-check.json' -File);
          if ($receipts.Count -ne 1) { throw ('expected exactly 1 manifest-check receipt, found ' + $receipts.Count) };
          $d = [System.IO.File]::ReadAllText($receipts[0].FullName) | ConvertFrom-Json;
          if ([string]$d.status -ne 'PASS') { throw ('REFUSED: manifest receipt status is ' + $d.status + ' :: ' + (@($d.problems) -join ' | ')) };
          if ([int]$d.entries -ne 111) { throw ('REFUSED: manifest receipt records ' + $d.entries + ' entries, 111 are required') };
          if ([int]$d.checksumFiles -lt 200) { throw ('REFUSED: only ' + $d.checksumFiles + ' checksum files verified') };
          if (@($d.problems).Count -ne 0) { throw ('REFUSED: manifest receipt lists problems: ' + (@($d.problems) -join ' | ')) };
          Write-Host ('MANIFEST RECEIPT OK entries=' + $d.entries + ' checksumFiles=' + $d.checksumFiles) }
          catch { Write-Host ('::error::CLASH-MANIFEST-RECEIPT ' + ($_.Exception.Message -replace '\r?\n', ' ')); exit 1 }"

      - name: Verify the suite receipt (494/494, machine summary agreed, adapter 5.2.0)
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -Command "try { $ErrorActionPreference = 'Stop';
          $receipts = @(Get-ChildItem -Path 'supabase/cloud/evidence' -Filter '*-test-run.json' -File);
          if ($receipts.Count -ne 1) { throw ('expected exactly 1 test-run receipt, found ' + $receipts.Count) };
          $d = [System.IO.File]::ReadAllText($receipts[0].FullName) | ConvertFrom-Json;
          if ([string]$d.status -ne 'PASS') { throw ('REFUSED: suite receipt status is ' + $d.status) };
          if ([int]$d.passLines -ne 494) { throw ('REFUSED: ' + $d.passLines + ' assertion(s) passed, 494 are required') };
          if ([int]$d.failLines -ne 0) { throw ('REFUSED: ' + $d.failLines + ' assertion(s) failed') };
          if ([int]$d.assertionsExecuted -ne 494) { throw ('REFUSED: ' + $d.assertionsExecuted + ' assertion(s) executed, 494 are required') };
          if (-not $d.machineReadable) { throw 'REFUSED: the suite summary line did not agree with its own PASS/FAIL counts' };
          if ([string]$d.adapter.version -ne '5.2.0') { throw ('REFUSED: the suite ran on adapter ' + $d.adapter.version) };
          if ([string]$d.outcome -ne 'SUCCEEDED') { throw ('REFUSED: native outcome was ' + $d.outcome) };
          Write-Host ('SUITE RECEIPT OK 494/494 failures=0 machineReadable=' + $d.machineReadable + ' adapter=' + $d.adapter.version) }
          catch { Write-Host ('::error::CLASH-SUITE-RECEIPT ' + ($_.Exception.Message -replace '\r?\n', ' ')); exit 1 }"

      - name: Publish receipt state as annotations (always runs, never fails the job)
        if: always()
        shell: cmd
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive
          -ExecutionPolicy Bypass -Command "try {
          $adapter = 'supabase/cloud/evidence-adapter/ci-adapter-selftest.json'; $lines = @();
          if (-not (Test-Path -LiteralPath $adapter)) { $lines += 'error|adapter receipt: absent (the self-test did not reach a verdict)' }
          else { $d = [System.IO.File]::ReadAllText($adapter) | ConvertFrom-Json; $level = 'error';
          if ([string]$d.verdict -eq 'PASS') { $level = 'notice' };
          $problems = (@($d.problems) -join ' | '); $lines += ($level + '|adapter receipt verdict=' + $d.verdict + ' cases=' + $d.casesExecuted + '/' + $d.casesExpected + ' ps=' + $d.powerShellVersion + ' problems=' + $problems);
          if ([string]$d.verdict -ne 'PASS' -and $null -ne $d.cases) {
          foreach ($entry in @($d.cases.PSObject.Properties)) {
          $c = $entry.Value; if ($null -eq $c) { continue }; if ([bool]$c.passed) { continue };
          $json = ''; try { $json = ($c | ConvertTo-Json -Depth 4 -Compress) } catch { $json = 'unserialisable detail' };
          if ($json.Length -gt 900) { $json = $json.Substring(0, 900) };
          $lines += ('warning|failed case ' + [string]$entry.Name + ' ' + $json) } } };
          foreach ($f in @(Get-ChildItem -Path 'supabase/cloud/evidence' -Filter '*-test-run.json' -File -ErrorAction SilentlyContinue)) {
          $d = [System.IO.File]::ReadAllText($f.FullName) | ConvertFrom-Json; $level = 'error'; if ([string]$d.status -eq 'PASS') { $level = 'notice' };
          $excerpt = [string]$d.stderrExcerpt; if ($excerpt.Length -gt 300) { $excerpt = $excerpt.Substring(0, 300) };
          $lines += ($level + '|suite receipt status=' + $d.status + ' passed=' + $d.passLines + ' failed=' + $d.failLines + ' machineReadable=' + $d.machineReadable + ' stderr=' + $excerpt) };
          foreach ($f in @(Get-ChildItem -Path 'supabase/cloud/evidence' -Filter '*-manifest-check.json' -File -ErrorAction SilentlyContinue)) {
          $d = [System.IO.File]::ReadAllText($f.FullName) | ConvertFrom-Json; $level = 'error'; if ([string]$d.status -eq 'PASS') { $level = 'notice' };
          $lines += ($level + '|manifest receipt status=' + $d.status + ' entries=' + $d.entries + ' checksumFiles=' + $d.checksumFiles + ' problems=' + ((@($d.problems)) -join ' | ')) };
          $sumPath = 'supabase/cloud/checksums.sha256';
          if (Test-Path -LiteralPath $sumPath) { $t = [System.IO.File]::ReadAllText($sumPath);
          $rows = @($t -split [char]10 | Where-Object { $_ -match '\S' });
          $lines += ('notice|checksum file lines=' + $rows.Count + ' crlfPairs=' + ([regex]::Matches($t, '\r\n')).Count) };
          if ($lines.Count -eq 0) { $lines += 'error|no receipts were written at all: treat as FAIL, never as unknown' };
          foreach ($l in $lines) { $i = $l.IndexOf('|'); $level = $l.Substring(0, $i);
          $message = $l.Substring($i + 1) -replace '\r?\n', ' ';
          Write-Host ('::' + $level + '::CLASH-EVIDENCE ' + $message) } }
          catch { Write-Host ('::error::CLASH-EVIDENCE-READER ' + ($_.Exception.Message -replace '\r?\n', ' ')) }"

      - name: Upload diagnostic evidence (no secrets are produced or uploaded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clash-windows-offline-evidence
          path: |
            supabase/cloud/evidence/*.json
            supabase/cloud/evidence-adapter/*.json
          if-no-files-found: warn
          retention-days: 14
